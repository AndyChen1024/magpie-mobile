<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>连接手机</title>
<link rel="icon" type="image/png" href="{{ICON}}">
<style nonce="{{NONCE}}">{{CSS}}</style>
</head>
<body data-token="{{TOKEN}}">
<main>
  <header>
    <div class="heading">
      <img src="{{ICON}}" alt="" width="36" height="36">
      <h1>连接手机</h1>
    </div>
  </header>

  <section class="pairing-section" aria-labelledby="connection-title">
    <h2 id="connection-title">扫码配对</h2>
    <p>在手机 Magpie 打开「更多 → 连接手机」，扫描这里生成的二维码。</p>
    <p>Android 真机通过 USB 连接本地中继时，在 Mac 运行 <code>adb reverse tcp:18400 tcp:18400</code>。重新插拔 USB 后，若转发已失效，请再运行一次。</p>
    <span id="status" data-status="loading" role="status">Mac 中继：正在检查</span>
    <p id="detail">正在读取本机连接状态。</p>
    <div class="actions">
      <button id="issue" class="primary" type="button" aria-describedby="detail" disabled>生成配对二维码</button>
      <button id="start" type="button" hidden>开启后台连接</button>
      <button id="retry" type="button" hidden>刷新中继状态</button>
      <button id="stop" type="button" hidden>关闭后台连接</button>
    </div>
    <label id="pair-usage-option" hidden>
      <input id="pair-usage" type="checkbox" autocomplete="off">
      允许本次配对的新设备查看用量
    </label>
    <div id="pairing" hidden>
      <img id="qr" alt="手机配对二维码">
      <div class="pairing-info">
        <p>二维码两分钟内有效，仅可使用一次。重新生成会使旧码失效。</p>
        <input id="link" aria-label="配对链接" readonly spellcheck="false">
        <div class="actions">
          <button id="select-link" type="button">选中链接</button>
          <button id="cancel" type="button">取消配对</button>
        </div>
      </div>
    </div>
  </section>

  <section aria-labelledby="devices-title">
    <h2 id="devices-title">已授权设备</h2>
    <p>手机断开后仍保留授权。重装后可扫码重新配对，并在这里撤销旧授权。</p>
    <p id="empty">正在读取设备…</p>
    <ul id="devices"></ul>
  </section>

  <p id="notice" role="status"></p>
</main>
<dialog id="confirm-revoke" aria-labelledby="confirm-title">
  <h2 id="confirm-title">撤销设备权限</h2>
  <p id="confirm-label"></p>
  <div class="actions">
    <button id="keep-device" type="button" autofocus>保留设备</button>
    <button id="revoke-device" type="button">确认撤销</button>
  </div>
</dialog>
<script nonce="{{NONCE}}">{{SCRIPT}}</script>
</body>
</html>
