<!doctype html>
<html lang="en">

        <title id="system-architecture-en-title">Mobile architecture</title>
        <desc id="system-architecture-en-desc">The app queries the local Magpie gateway for usage and will use a relay to exchange end-to-end encrypted messages with the host, where the agent runs.</desc>

        <text x="32" y="581" fill="#55555F" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" text-anchor="start">Android supports local usage. iOS integration is in progress. Arrows follow requests.</text>
